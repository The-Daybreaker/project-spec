# Release — 推送 main 后自动发布 GitHub Release（版本递增由 agent 本地执行）
# 规则（与根 AGENTS.md「版本管理」一致）：
#   - version.json 的 version 字段为单一事实来源；**版本递增由 agent 本地完成**
#     （scripts/bump_version.py，按 scripts/version-sync.json 同步 package.json /
#     Cargo.toml / pyproject.toml 等，并同步更新 private/dev/CHANGELOG.md——
#     private/ 不进 GitHub，CI 无法代劳）。
#   - 当前 version 尚无对应 tag → 自动打 tag vX.Y.Z 并创建 Release；
#   - 当前 version 已有 tag → 跳过（等待 agent 递增版本后再次推送）；
#   - 仓库尚无任何 tag 且由 push 触发 → 跳过（初始搭建期，可用 workflow_dispatch
#     或本地 gh release 手动发布首个版本）。
#   - 发布产物约定：构建/打包产物统一输出到 dist/（不进 git，见 .gitignore），
#     Release 自动 attach dist/**；产物在别处时调整下方 attach 逻辑。
# 注意：private/ 不进 GitHub，CI 中不可用；发布说明由提交记录自动生成。
#       push 触发与 workflow_dispatch 可能并发，Release 步骤按幂等处理。

name: Release

on:
  push:
    branches:
      - "{{DEFAULT_BRANCH}}"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decide version
        id: decide
        shell: python
        run: |
          import json
          import os
          import subprocess

          v = json.load(open("version.json", encoding="utf-8"))["version"]
          tags = subprocess.run(["git", "tag"], capture_output=True, text=True).stdout.split()

          lines = []
          if not tags and os.environ.get("GITHUB_EVENT_NAME") == "push":
              lines.append("should_release=false")
              lines.append("reason=initial setup (no tags yet); release manually via workflow_dispatch or gh")
          else:
              tagged = subprocess.run(
                  ["git", "tag", "-l", "v" + v], capture_output=True, text=True
              ).stdout.strip()
              if tagged:
                  lines.append("should_release=false")
                  lines.append("reason=v" + v + " already tagged; bump version.json locally (bump_version.py) and push")
              else:
                  lines.append("should_release=true")
                  lines.append("version=" + v)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

      - name: Create GitHub Release
        if: steps.decide.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent: push and workflow_dispatch can race; reuse existing tag/release.
          set -e
          v="${{ steps.decide.outputs.version }}"
          git tag "v$v" 2>/dev/null || true
          git push origin "v$v" 2>/dev/null || true
          attach=()
          if [ -d dist ]; then
            while IFS= read -r -d '' f; do attach+=("--attach" "$f"); done < <(find dist -type f -print0)
          fi
          if ! gh release create "v$v" --title "v$v" --generate-notes "${attach[@]}" >/dev/null 2>&1; then
            if ! gh release view "v$v" >/dev/null 2>&1; then
              echo "gh release create failed for v$v" >&2
              exit 1
            fi
            echo "release already exists: v$v"
          fi

      # --- 按项目追加构建产物步骤（示例） ---
      # - name: Build artifacts
      #   run: npm run build
      # - name: Upload artifacts to release
      #   if: steps.decide.outputs.should_release == 'true'
      #   run: gh release upload "v${{ steps.decide.outputs.version }}" dist/**/*.zip
