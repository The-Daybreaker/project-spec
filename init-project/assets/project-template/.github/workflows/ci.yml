# CI — 持续集成检查（本地与 CI 共用 scripts/ci-check.ps1 入口）
# 按项目技术栈在此追加工具链与检查步骤（见下方注释示例）。

name: CI

on:
  push:
    branches:
      - "{{DEFAULT_BRANCH}}"
  pull_request:
    branches:
      - "{{DEFAULT_BRANCH}}"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run project checks
        shell: pwsh
        run: ./scripts/ci-check.ps1

